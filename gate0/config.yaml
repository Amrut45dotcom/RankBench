data_root: ~/RankBench
repo_root: ~/rankbench_v2

paths:
  pid_list: embeddings/pid_list.npy
  faiss_index: faiss_index/bge_large_1M.index
  bm25_index: bm25_index_1M
  splits_dir: ~/rankbench_v2/splits
  results_dir: results

dataset: msmarco-passage/dev/small
seed: 42

models:
  dense: BAAI/bge-large-en-v1.5
  query_prefix: ""   # VERIFY vs old code
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2                               # VERIFY vs old code

topk:
  bm25: 100
  dense: 100
  rrf_out: 100
  rrf_k: 60
  rerank_depth: 100
  final_eval: 100

bm25_tokenize:            # VERIFY vs 02_build_bm25_1m.py
  stopwords: null
  stemmer: null           # set to "english" if the index was built with PyStemmer

hardware:
  gpu_id: 2
  faiss_threads: 8
  bm25_threads: 8

batching:
  encode_batch: 128
  search_batch: 512
  rerank_batch: 256

latency:
  sample_size: 500
  repeats: 3
  warmup_repeats: 1